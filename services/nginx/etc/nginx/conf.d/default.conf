server {
    listen 80;
    server_name librechat.example.local keycloak.example.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name keycloak.example.local;

    ssl_certificate     /etc/nginx/certs/keycloak.example.local/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/keycloak.example.local/privkey.pem;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name librechat.example.local;

    ssl_certificate     /etc/nginx/certs/librechat.example.local/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/librechat.example.local/privkey.pem;

    location / {
        proxy_pass http://librechat-web:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
